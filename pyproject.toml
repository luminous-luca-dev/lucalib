[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucalib"
version = "0.1.0"
description = "Plot training and validation loss and accuracy histories."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
